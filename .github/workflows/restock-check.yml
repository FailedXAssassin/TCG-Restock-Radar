name: TCG Restock Check

on:
  workflow_dispatch:
  # Automatic checks run on Railway now. Keep this manual for diagnostics.

permissions:
  contents: write

concurrency:
  group: tcg-restock-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check configured product pages
        run: python scripts/check_restocks.py

      - name: Commit updated feed
        run: |
          git config user.name "tcg-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add restocks.json
          git diff --cached --quiet || git commit -m "Update restock feed"
          git push
